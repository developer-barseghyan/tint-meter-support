<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ site.description | escape }}">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#292e38">
<link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/favicon.png">
<link rel="apple-touch-icon" href="{{ site.baseurl }}/assets/icon.png">
<style>
/* Colours are the app's own tokens (Design/Theme.swift). The app is dark only, and so is this site. */
:root{
  --bg:#0e1015;
  --haze:#292e38;
  --surface:#1c1f26;
  --surface2:#292b36;
  --border:rgba(255,255,255,.08);
  --text:#f5f2f0;
  --text2:#9ea6b3;
  --text3:#737a87;
  --cream:#f5ebe3;
  --cream-text:#1a1c21;
  --accent:#73aded;
  --good:#6bd1ad;
  --warn:#edb866;
  --bad:#e67370;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 14px 34px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background-color:var(--bg);
  background-image:linear-gradient(180deg, var(--haze) 0, var(--bg) 440px);
  background-repeat:no-repeat;
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

.wrap{max-width:46rem;margin:0 auto;padding:0 18px}

header.bar{padding:36px 0 24px;text-align:center}
header.bar .icon{
  display:block;
  width:76px;height:76px;
  margin:0 auto 14px;
  border-radius:22.5%;
  box-shadow:0 8px 22px rgba(0,0,0,.45);
}
/* The app's headings are New York, its large numbers SF Light. */
header.bar .app,h2,h3{
  font-family:ui-serif,"New York","Iowan Old Style",Georgia,serif;
  font-weight:400;
}
header.bar .app{margin:0;font-size:1.5rem;letter-spacing:-0.01em}
header.bar .sub{
  margin:4px 0 0;
  color:var(--text3);
  font-size:.74rem;
  font-weight:500;
  letter-spacing:.12em;
  text-transform:uppercase;
}

nav{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:20px;
}
nav a{
  display:inline-block;
  padding:7px 18px;
  border-radius:999px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text2);
  text-decoration:none;
  font-size:.9rem;
  font-weight:500;
  transition:color .15s, border-color .15s;
}
nav a:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
/* Selected chip: the app's primary (cream) button. */
nav a.here,nav a.here:hover{
  background:var(--cream);
  border-color:var(--cream);
  color:var(--cream-text);
  font-weight:600;
}

main.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:38px 34px 34px;
  margin-bottom:26px;
}
main.card > :first-child{margin-top:0}

h1{
  font-size:2rem;
  line-height:1.2;
  letter-spacing:-0.02em;
  margin:0 0 .6em;
  font-weight:300;
}
h2{font-size:1.4rem;margin:2.1em 0 .5em;letter-spacing:-0.005em}
h3{font-size:1.1rem;margin:1.9em 0 .4em}
p,li{overflow-wrap:break-word}
main.card p,main.card li,main.card td{color:var(--text2)}
main.card strong{color:var(--text)}
li{margin:.3em 0}
a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
strong{font-weight:600}
hr{border:0;border-top:1px solid var(--border);margin:2.3em 0}

code{
  background:var(--surface2);
  color:var(--text);
  padding:.14em .4em;
  border-radius:5px;
  font-size:.88em;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

/* "In short" panels */
blockquote{
  margin:1.4em 0;
  padding:.85em 1.1em;
  border:1px solid rgba(245,235,227,.22);
  border-radius:12px;
  background:rgba(245,235,227,.05);
}
blockquote p{margin:.35em 0}
main.card blockquote p{color:var(--text)}

/* Verdicts and states, coloured as the app shows them */
.tag{
  display:inline-block;
  padding:.08em .6em;
  border-radius:999px;
  font-size:.76em;
  font-weight:600;
  white-space:nowrap;
  vertical-align:.08em;
  border:1px solid;
}
.tag.good{color:var(--good);background:rgba(107,209,173,.1);border-color:rgba(107,209,173,.32)}
.tag.warn{color:var(--warn);background:rgba(237,184,102,.1);border-color:rgba(237,184,102,.32)}
.tag.bad{color:var(--bad);background:rgba(230,115,112,.1);border-color:rgba(230,115,112,.32)}
.tag.neutral{color:var(--text2);background:rgba(158,166,179,.08);border-color:rgba(158,166,179,.28)}

.table-scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;margin:1.3em 0;font-size:.94rem}
th,td{border-bottom:1px solid var(--border);padding:9px 12px;text-align:left;vertical-align:top}
thead th{
  color:var(--text3);
  font-weight:500;
  font-size:.74rem;
  letter-spacing:.12em;
  text-transform:uppercase;
}
tbody td:first-child{color:var(--text);font-weight:600}
tbody tr:last-child td{border-bottom:0}

footer{
  padding:4px 0 54px;
  color:var(--text3);
  font-size:.86rem;
  text-align:center;
}
footer a{color:var(--text3);text-decoration:none}
footer a:hover{color:var(--text);text-decoration:underline}
footer p{margin:.3em 0}

@media (max-width:560px){
  .wrap{padding:0 14px}
  header.bar{padding:26px 0 18px}
  header.bar .icon{width:64px;height:64px}
  main.card{padding:26px 20px 24px;border-radius:18px}
  h1{font-size:1.7rem}
  h2{font-size:1.25rem}
  nav a{padding:6px 14px;font-size:.86rem}
  table{font-size:.88rem}
  th,td{padding:8px 8px}
}
</style>
</head>
<body>

<div class="wrap">

  <header class="bar">
    <img class="icon" src="{{ site.baseurl }}/assets/icon.png" width="76" height="76" alt="Tint Meter app icon">
    <p class="app">Tint Meter</p>
    <p class="sub">Window tint VLT</p>
    <nav>
      <a href="{{ site.baseurl }}/"{% if page.url == "/" %} class="here"{% endif %}>Support</a>
      <a href="{{ site.baseurl }}/privacy"{% if page.url contains "privacy" %} class="here"{% endif %}>Privacy</a>
      <a href="{{ site.baseurl }}/terms"{% if page.url contains "terms" %} class="here"{% endif %}>Terms</a>
    </nav>
  </header>

  <main class="card">
{{ content }}
  </main>

  <footer>
    <p><a href="mailto:developer.barseghyan@gmail.com">developer.barseghyan@gmail.com</a></p>
    <p>Estimates only. Not a certified tint meter.</p>
    <p>&copy; {{ site.time | date: "%Y" }} Tigran Barseghyan</p>
  </footer>

</div>

</body>
</html>
